<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Welcome to Job Application Tracker</h1>
    <p>Track and manage your job applications</p>
</header>

<main class="layout">
    <section class="form-section">
    <h2>Add an Application</h2>
    <form id="applicationForm">
        <label for="company">Company:</label>
        <input type="text" id="company" name="company" required>

        <label for="position">Position:</label>
        <input type="text" id="position" name="position" required>

        <label for="status">Status:</label>
            <select id="status" name="status" required>
                   <option value="">Select status</option>
                    <option value="Not Applied Yet">Not Applied Yet</option>
                    <option value="Applied">Applied</option>
                    <option value="Online Assessment">Online Assessment</option>
                    <option value="Interviewing">Interviewing</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
            </select>

        <label for="fitScore">Fit Score (1-10):</label>
            <input type="number" id="fitScore" min="1" max="10">

        <label for="resumeUsed">Resume Used:</label>
            <input type="text" id="resumeUsed" placeholder="e.g. SWE_v4">

        <label for="dateApplied">Date Applied:</label>
            <input type="date" id="dateApplied">

        <label for="jobUrl">Job Posting URL:</label>
            <input type="url" id="jobUrl" placeholder="https://...">

        <button type="submit">Add Application</button>
    </form>
    <p id="statusMessage"></p>
    </section>

    <section class="list-section">
    <h2>Job Listings</h2>

    <button id="loadBtn">View Jobs</button>

    <div id="jobList"></div>
    </section>
</main>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Our JavaScript -->
    <script src="script.js"></script>



</body>
</html>
